name: Build & Deliver Android Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with APK'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Sign Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Release Keystore or Generate Fallback Release Key
        id: keystore-setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Using production signing keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            echo "KS_PASS=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KS_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KS_KEYPASS=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >> $GITHUB_ENV
          else
            echo "Notice: KEYSTORE_BASE64 secret not yet configured. Generating secure one-time Release Keystore for this run..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias studentattendance \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "attendance2026release" \
              -keypass "attendance2026release" \
              -dname "CN=Student Attendance Manager, OU=School, O=Academic, L=City, ST=State, C=US"
            echo "KS_PASS=attendance2026release" >> $GITHUB_ENV
            echo "KS_ALIAS=studentattendance" >> $GITHUB_ENV
            echo "KS_KEYPASS=attendance2026release" >> $GITHUB_ENV
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Assemble Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Set up Android SDK Build Tools
        uses: android-actions/setup-android@v3

      - name: Align and Sign Release APK
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -type f -name apksigner | sort -V | tail -n 1 | xargs dirname)
          echo "Using Android Build Tools at: $BUILD_TOOLS_DIR"
          
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Found compiled release APK: $RAW_APK"
          
          # Zipalign
          $BUILD_TOOLS_DIR/zipalign -v -p 4 "$RAW_APK" android/app/build/outputs/apk/release/aligned.apk
          
          # Sign using apksigner
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:"$KS_PASS" \
            --ks-key-alias "$KS_ALIAS" \
            --key-pass pass:"$KS_KEYPASS" \
            --out Student-Attendance-Manager-Release.apk \
            android/app/build/outputs/apk/release/aligned.apk

      - name: Verify APK Signature & Metadata
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -type f -name apksigner | sort -V | tail -n 1 | xargs dirname)
          
          echo "=========================================================="
          echo "APK SIGNATURE VERIFICATION:"
          $BUILD_TOOLS_DIR/apksigner verify --verbose Student-Attendance-Manager-Release.apk
          
          echo "=========================================================="
          echo "PACKAGE DETAILS:"
          $BUILD_TOOLS_DIR/aapt dump badging Student-Attendance-Manager-Release.apk | grep -E "package: name=|launchable-activity:"
          
          echo "=========================================================="
          echo "FILE SIZE AND CHECKSUM:"
          ls -lh Student-Attendance-Manager-Release.apk
          sha256sum Student-Attendance-Manager-Release.apk
          echo "=========================================================="

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Student-Attendance-Manager-Release
          path: Student-Attendance-Manager-Release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release with APK Attached
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true || github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk-${{ github.run_number }}
          name: Student Attendance Manager v1.0.0 (Release APK)
          draft: false
          prerelease: false
          body: |
            ## Student Attendance Manager - Android Release
            
            - **Filename:** `Student-Attendance-Manager-Release.apk`
            - **Package ID:** `com.studentattendance.manager`
            - **Version:** `1.0.0 (VersionCode 1)`
            - **Build Date:** ${{ github.event.head_commit.timestamp || 'Latest' }}
            
            ### Download & Install:
            1. Download `Student-Attendance-Manager-Release.apk` on your Android device.
            2. Tap to install. Allow unknown sources if prompted.
            3. Open the app to access the attendance manager.
          files: |
            Student-Attendance-Manager-Release.apk
